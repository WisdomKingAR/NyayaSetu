services:
  - type: web
    name: nyayasetu-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Configure the following secret variables in the Render Dashboard:
      # - SUPABASE_URL
      # - SUPABASE_SERVICE_ROLE_KEY
      # - SUPABASE_ANON_KEY
      # - DATABASE_URL (Supavisor Transaction pooler URL on port 6543)
      # - GEMINI_API_KEY
      # - SARVAM_API_KEY
      # - FRONTEND_URL: NO trailing slash! (e.g. https://nyaya-setu-amber.vercel.app)
      #   A trailing slash causes browser CORS violations (RFC 6454 origin comparison).
